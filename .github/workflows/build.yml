name: build

# Every push and pull request is tested and built. Pushing a tag such as
# v0.1.0 also publishes the binaries as a GitHub release, which is where
# install.sh downloads them from.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: make test

      - name: Build all targets
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            make dist VERSION="$GITHUB_REF_NAME"
          else
            make dist
          fi

      - name: Checksums
        working-directory: dist
        run: sha256sum osync-* > checksums.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
